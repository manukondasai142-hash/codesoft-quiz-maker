<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSoft Quiz Maker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    
   .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 { 
      text-align: center; 
      color: #667eea; 
      margin-bottom: 10px;
    }
    
   .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    
   .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    
   .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: #f0f0f0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }
    
   .tab-btn.active {
      background: #667eea;
      color: white;
    }
    
   .section { display: none; }
   .section.active { display: block; }
    
    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1em;
    }
    
   .option-group {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }
    
   .option-group input[type="radio"] { width: auto; }
    
    button {
      padding: 12px 25px;
      background: #34c759;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px 10px 0;
    }
    
    button:hover { background: #28a745; }
    
   .btn-secondary { background: #4a90e2; }
   .btn-secondary:hover { background: #357abd; }
   .btn-danger { background: #dc3545; }
   .btn-danger:hover { background: #c82333; }
    
   .quiz-card {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin: 15px 0;
      border-left: 4px solid #667eea;
    }
    
   .question {
      font-size: 1.2em;
      margin-bottom: 15px;
      font-weight: bold;
    }
    
   .option {
      padding: 12px;
      background: white;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid #ddd;
      transition: 0.2s;
    }
    
   .option:hover { border-color: #667eea; }
   .option.selected { border-color: #667eea; background: #e8f0fe; }
    
   .result {
      text-align: center;
      padding: 30px;
      background: #e8f0fe;
      border-radius: 10px;
      margin-top: 20px;
    }
    
   .score { font-size: 3em; color: #667eea; font-weight: bold; }
    
   .home-card {
      text-align: center;
      padding: 30px;
      background: #f8f9fa;
      border-radius: 10px;
    }
    
    @media (max-width: 600px) {
     .container { padding: 20px; }
      h1 { font-size: 1.5em; }
     .tabs { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧠 CodeSoft Quiz Maker</h1>
    <p class="subtitle">Create quizzes & test your knowledge</p>
    
    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('home')">Home</button>
      <button class="tab-btn" onclick="showTab('create')">Create Quiz</button>
      <button class="tab-btn" onclick="showTab('take')">Take Quiz</button>
      <button class="tab-btn" onclick="showTab('list')">My Quizzes</button>
    </div>
    
    <!-- HOME -->
    <div id="home" class="section active">
      <div class="home-card">
        <h2>Welcome to Quiz Maker!</h2>
        <p style="margin: 20px 0; color: #666;">Create your own quizzes or take existing ones. Get instant feedback on your scores.</p>
        <button onclick="showTab('create')" class="btn-secondary">Create New Quiz</button>
        <button onclick="showTab('list')">Browse Quizzes</button>
      </div>
    </div>
    
    <!-- CREATE QUIZ -->
    <div id="create" class="section">
      <h2>Create New Quiz</h2>
      <input type="text" id="quizTitle" placeholder="Quiz Title: e.g., JavaScript Basics">
      <textarea id="question" placeholder="Enter your question here"></textarea>
      
      <div class="option-group">
        <input type="radio" name="correct" value="0" checked>
        <input type="text" id="opt0" placeholder="Option 1 - Select radio if correct">
      </div>
      <div class="option-group">
        <input type="radio" name="correct" value="1">
        <input type="text" id="opt1" placeholder="Option 2">
      </div>
      <div class="option-group">
        <input type="radio" name="correct" value="2">
        <input type="text" id="opt2" placeholder="Option 3">
      </div>
      <div class="option-group">
        <input type="radio" name="correct" value="3">
        <input type="text" id="opt3" placeholder="Option 4">
      </div>
      
      <button onclick="addQuestion()">Add Question</button>
      <button class="btn-secondary" onclick="saveQuiz()">Save Quiz</button>
      <button class="btn-danger" onclick="resetForm()">Clear All</button>
      <p id="qCount" style="margin-top:10px; color:#666;">Questions added: 0</p>
    </div>
    
    <!-- TAKE QUIZ -->
    <div id="take" class="section">
      <h2>Take Quiz</h2>
      <div id="quizArea"></div>
    </div>
    
    <!-- QUIZ LIST -->
    <div id="list" class="section">
      <h2>Available Quizzes</h2>
      <div id="quizList"></div>
    </div>
  </div>

  <script>
    let currentQuiz = { title: '', questions: [] };
    let allQuizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');
    let currentQIndex = 0;
    let score = 0;
    let userAnswers = [];
    
    // Add demo quiz if empty
    if (allQuizzes.length === 0) {
      allQuizzes.push({
        title: "JavaScript Basics Demo",
        questions: [
          { q: "What does HTML stand for?", opts: ["Hyper Text Markup Language", "High Tech Modern Language", "Home Tool Markup Language", "Hyperlinks Text Mark Language"], ans: 0 },
          { q: "Which is not a JavaScript data type?", opts: ["String", "Boolean", "Float", "Undefined"], ans: 2 },
          { q: "How do you create a function in JS?", opts: ["function myFunc()", "create myFunc()", "def myFunc()", "func myFunc()"], ans: 0 }
        ]
      });
      localStorage.setItem('quizzes', JSON.stringify(allQuizzes));
    }

    function showTab(tab) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      if (tab === 'list') loadQuizList();
      if (tab === 'take' && currentQuiz.questions.length === 0) {
        document.getElementById('quizArea').innerHTML = '<p style="text-align:center; color:#666;">Select a quiz from "My Quizzes" tab first!</p>';
      }
    }

    function addQuestion() {
      const q = document.getElementById('question').value.trim();
      const opts = [0,1,2,3].map(i => document.getElementById('opt'+i).value.trim());
      const ans = parseInt(document.querySelector('input[name="correct"]:checked').value);
      
      if (!q || opts.some(o =>!o)) {
        alert('Please fill all fields!');
        return;
      }
      
      currentQuiz.questions.push({ q, opts, ans });
      document.getElementById('question').value = '';
      opts.forEach((_, i) => document.getElementById('opt'+i).value = '');
      document.getElementById('qCount').textContent = `Questions added: ${currentQuiz.questions.length}`;
    }

    function saveQuiz() {
      const title = document.getElementById('quizTitle').value.trim();
      if (!title || currentQuiz.questions.length === 0) {
        alert('Add title and at least 1 question!');
        return;
      }
      currentQuiz.title = title;
      allQuizzes.push(currentQuiz);
      localStorage.setItem('quizzes', JSON.stringify(allQuizzes));
      alert('✅ Quiz saved successfully!');
      resetForm();
    }

    function resetForm() {
      currentQuiz = { title: '', questions: [] };
      document.getElementById('quizTitle').value = '';
      document.getElementById('question').value = '';
      [0,1,2,3].forEach(i => document.getElementById('opt'+i).value = '');
      document.getElementById('qCount').textContent = 'Questions added: 0';
    }

    function loadQuizList() {
      const list = document.getElementById('quizList');
      list.innerHTML = allQuizzes.map((qz, i) => `
        <div class="quiz-card">
          <h3>${qz.title}</h3>
          <p>${qz.questions.length} Questions</p>
          <button onclick="startQuiz(${i})">Start Quiz</button>
          <button class="btn-danger" onclick="deleteQuiz(${i})">Delete</button>
        </div>
      `).join('') || '<p>No quizzes yet. Create one!</p>';
    }

    function deleteQuiz(index) {
      if (confirm('Delete this quiz?')) {
        allQuizzes.splice(index, 1);
        localStorage.setItem('quizzes', JSON.stringify(allQuizzes));
        loadQuizList();
      }
    }

    function startQuiz(index) {
      currentQuiz = allQuizzes[index];
      currentQIndex = 0;
      score = 0;
      userAnswers = [];
      showTab('take');
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      showQuestion();
    }

    function showQuestion() {
      const q = currentQuiz.questions[currentQIndex];
      document.getElementById('quizArea').innerHTML = `
        <div class="quiz-card">
          <p>Question ${currentQIndex + 1} of ${currentQuiz.questions.length}</p>
          <div class="question">${q.q}</div>
          ${q.opts.map((opt, i) => `
            <div class="option" onclick="selectAnswer(${i})" id="opt-${i}">${opt}</div>
          `).join('')}
          <button onclick="nextQuestion()" style="margin-top:15px;">${currentQIndex === currentQuiz.questions.length - 1? 'Finish' : 'Next'}</button>
        </div>
      `;
    }

    function selectAnswer(i) {
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      document.getElementById(`opt-${i}`).classList.add('selected');
      userAnswers[currentQIndex] = i;
    }

    function nextQuestion() {
      if (userAnswers[currentQIndex] === undefined) {
        alert('Please select an answer!');
        return;
      }
      if (userAnswers[currentQIndex] === currentQuiz.questions[currentQIndex].ans) score++;
      currentQIndex++;
      if (currentQIndex < currentQuiz.questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const percent = Math.round((score / currentQuiz.questions.length) * 100);
      document.getElementById('quizArea').innerHTML = `
        <div class="result">
          <h2>Quiz Completed! 🎉</h2>
          <div class="score">${percent}%</div>
          <p>You got ${score} out of ${currentQuiz.questions.length} correct</p>
          <button onclick="showTab('list')" class="btn-secondary">Back to Quizzes</button>
          <button onclick="startQuiz(${allQuizzes.indexOf(currentQuiz)})">Retake Quiz</button>
        </div>
      `;
    }

    loadQuizList();
  </script>
</body>
</html>
